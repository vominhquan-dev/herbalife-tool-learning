<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herbalife Tool</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <!-- Header -->
      <div class="header">
        <div class="title-wrapper">
          <h2>Herbalife Tool Learning</h2>
          <span class="badge">v2.0</span>
        </div>
        <p class="author">by <span>Võ Minh Quân</span></p>
      </div>

      <!-- Body -->
      <div class="body">
        <div class="input-group">
          <label for="scoreInput">SCORE</label>
          <input type="number" id="scoreInput" value="100" min="0" max="100" />
        </div>

        <div class="button-group">
          <button class="btn btn-primary" id="startBtn">Start</button>
          <button class="btn btn-outline" id="resetBtn">Reset</button>
        </div>

        <div class="track">
          <div class="fill" id="progressBar"></div>
        </div>

        <div id="status" class="hint"></div>

        <div id="outputSection" class="logs">
          <pre id="output"></pre>
        </div>
      </div>

      <hr class="divider" />

      <!-- Footer -->
      <div class="footer">
        <a
          href="https://github.com/vominhquan-dev"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">

              d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
            />
          </svg>
          github.com/vominhquan-dev
        </a>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
